services:
  - type: web
    name: nexarelay-creem-bridge
    runtime: node
    plan: free
    rootDir: creem-bridge
    buildCommand: ""
    startCommand: "node src/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ONE_API_BASE_URL
        value: https://api.getnexarelay.com
      - key: CREEM_API_BASE_URL
        value: https://api.creem.io
      - key: CREEM_API_KEY
        sync: false
      - key: CREEM_WEBHOOK_SECRET
        sync: false
      - key: CREEM_PRODUCT_STARTER
        sync: false
      - key: CREEM_PRODUCT_PLUS
        sync: false
      - key: CREEM_PRODUCT_PRO
        sync: false
      - key: ONE_API_ADMIN_TOKEN
        sync: false
      - key: ONE_API_AUTH_HEADER
        value: Authorization
      - key: ONE_API_AUTH_SCHEME
        value: Bearer
      - key: TOPUP_MODE
        value: direct
      - key: BRIDGE_CHECKOUT_SECRET
        sync: false
