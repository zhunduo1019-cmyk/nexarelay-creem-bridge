services:
  - type: web
    name: nexarelay-creem-bridge
    runtime: node
    plan: free
    rootDir: creem-bridge
    buildCommand: ""
    startCommand: "node src/migrate.js && node src/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ONE_API_BASE_URL
        value: https://api.getnexarelay.com
      - key: DATABASE_URL
        sync: false
      - key: PAYMENT_PUBLIC_ENABLED
        value: "false"
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ONE_API_ADMIN_TOKEN
        sync: false
      - key: ONE_API_AUTH_HEADER
        value: Authorization
      - key: ONE_API_AUTH_SCHEME
        value: Bearer
      - key: TOPUP_MODE
        value: direct
      - key: BRIDGE_CHECKOUT_SECRET
        sync: false
